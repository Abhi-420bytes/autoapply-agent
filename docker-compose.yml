# AutoApply Agent — local stack. All ports bind to 127.0.0.1 only.
name: autoapply

x-backend-env: &backend-env
  MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY in .env}
  MASTER_KEY_PREVIOUS: ${MASTER_KEY_PREVIOUS:-}
  API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
  DATABASE_URL: postgresql+psycopg://autoapply:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/autoapply
  REDIS_URL: redis://redis:6379/0
  DATA_DIR: /data
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CORS_ORIGINS: '["http://localhost:3000"]'
  DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: autoapply
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: autoapply
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoapply -d autoapply"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    environment: *backend-env
    volumes:
      - appdata:/data
      - ./backend/prompts:/app/prompts:ro  # edit prompts without rebuilding
      - ./backend/portal_configs:/app/portal_configs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach Ollama on the host
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-env
    volumes:
      - appdata:/data
      - ./backend/prompts:/app/prompts:ro
      - ./backend/portal_configs:/app/portal_configs:ro  # edit selectors without rebuilding
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api: { condition: service_healthy }  # api runs migrations first
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      API_URL: http://api:8000
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
      ALLOWED_HOSTS: localhost:3000,127.0.0.1:3000
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
