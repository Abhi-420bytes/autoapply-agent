<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AutoApply logo">
  <!-- AutoApply Agent logo. Created by Abhiram (Challa Abhiram). MIT license. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0E7FF"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <!-- trail: the applications going out -->
  <path d="M104 372 C 150 356, 176 330, 196 300" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 30"/>
  <!-- paper plane -->
  <path d="M120 250 L396 128 L324 392 L262 300 Z" fill="#FFFFFF"/>
  <path d="M396 128 L262 300 L246 372 L286 322 Z" fill="url(#wing)"/>
  <path d="M396 128 L262 300" stroke="#A5B4FC" stroke-width="6" stroke-linecap="round"/>
  <!-- AI spark -->
  <path d="M398 334 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10 z" fill="#FFFFFF"/>
</svg>
