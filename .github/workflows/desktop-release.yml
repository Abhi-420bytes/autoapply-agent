# Builds the AutoApply desktop apps (no Docker needed to run them) and attaches them to
# a GitHub release. Push a tag like v1.0.0, or run it by hand from the Actions tab.
# Created by Abhiram (Challa Abhiram). MIT license.
name: Desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TECTONIC_VERSION: "0.17.0"

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14  # Apple Silicon
            tectonic: aarch64-apple-darwin
          - runner: macos-15-intel  # Intel
            tectonic: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      # Optional Apple notarization: add these repository secrets (Apple Developer Program)
      # and every .dmg is signed + notarized, so macOS opens it without any warning.
      HAS_APPLE_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      - name: Install the backend and PyInstaller
        run: uv pip install --system ./backend pyinstaller
      - name: Download Tectonic
        run: |
          curl -fsSL -o tectonic.tgz "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-${{ matrix.tectonic }}.tar.gz"
          tar -xzf tectonic.tgz
          echo "TECTONIC_BIN=$PWD/tectonic" >> "$GITHUB_ENV"
      - name: Import the Apple signing certificate (only if configured)
        if: env.HAS_APPLE_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p build build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k build build.keychain
          rm cert.p12
      - name: Build AutoApply.app and .dmg
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"; [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="0.0.0-dev"
          PYTHON=python packaging/build_macos.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: AutoApply-macos-${{ matrix.tectonic }}
          path: packaging/dist/*.dmg
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/dist/*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
      - name: Install the backend and PyInstaller
        run: uv pip install --system ./backend pyinstaller
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build AutoApply for Windows
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0-dev" }
          packaging\build_windows.ps1 -Version $version -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: AutoApply-windows-x64
          path: |
            packaging/dist/*.exe
            packaging/dist/*.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/dist/AutoApply-windows-setup.exe
            packaging/dist/*.zip
