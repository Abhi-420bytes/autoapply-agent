[project]
name = "autoapply-agent"
version = "0.1.0"
description = "AutoApply Agent — tailors a LaTeX resume per job and applies via the placement portal."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8,<3",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.2",
    "cryptography>=43",
    "apscheduler>=3.10,<4",
    "redis>=5",
    "litellm>=1.102,<2",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1",
    "langgraph-checkpoint-sqlite>=3.0",  # desktop app (no Docker)
    "psycopg-pool>=3.2",
    "python-docx>=1.1",
    "playwright>=1.47",
    "pyyaml>=6",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]  # B008: FastAPI's Depends() default-arg idiom

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]
"alembic/versions/**" = ["E501", "F401"]  # autogenerated imports

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "pgvector.*", "sentence_transformers.*", "litellm.*", "pymupdf.*", "langgraph.*", "docx.*", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.latex.pdf", "app.services.templates", "app.knowledge.pdf_text", "app.email.ingest"]
disallow_untyped_calls = false  # pymupdf.Document is untyped
